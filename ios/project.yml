name: ipakill
options:
  bundleIdPrefix: io.github.aminoulogie
  deploymentTarget:
    iOS: "16.0"
targets:
  ipakill:
    type: application
    platform: iOS
    sources: [ipakill]
    info:
      path: ipakill/Info.plist
      properties:
        CFBundleDisplayName: ipakill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: ipakill talks to your PC over Wi-Fi to sign and install apps.
        # The PC is reached by plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aminoulogie.ipakill
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
