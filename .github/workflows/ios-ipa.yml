name: Test merged iOS ipa

on:
  push:
    branches: [lc-merge-test]
    paths: ['ios/**', '.github/workflows/ios-ipa.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_COMMIT: 4dbe0f9a626de801184a42c0be8d2cb105058e3d

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: echo "v=merge-test-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Check out pinned LiveContainer
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"
          git clone --filter=blob:none https://github.com/hugeBlack/LiveContainer.git lc
          cd lc
          git checkout --quiet "$LC_COMMIT"
          git config -f .gitmodules submodule.litehook.url https://github.com/LiveContainerMirror/litehook.git
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Merge ipakill into LiveContainer
        run: python3 ios/patch_lc.py "$RUNNER_TEMP/lc" "${{ steps.ver.outputs.v }}"

      - name: Archive unsigned
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/lc"
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos -arch arm64 \
            -archivePath "$RUNNER_TEMP/ipakill.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/build.log"
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/build.log"

      - name: Package IPA
        run: |
          set -eo pipefail
          APP="$RUNNER_TEMP/ipakill.xcarchive/Products/Applications/LiveContainer.app"
          test -d "$APP"
          rm -rf "$APP/Frameworks/SideStoreSupport.framework" "$APP/PlugIns" "$APP/Extensions"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "ipakill-${{ steps.ver.outputs.v }}.ipa" Payload -x "._*" -x ".DS_Store"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-test-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ipakill-merge-test-ipa
          path: ${{ runner.temp }}/ipakill-*.ipa
          if-no-files-found: error
          retention-days: 7
